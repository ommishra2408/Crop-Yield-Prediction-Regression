<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Yield Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🌾 Crop Yield Prediction</h1>

        <p class="subtitle">
            Predict crop yield using Machine Learning
        </p>

        <form id="predictionForm">

            <div class="form-group">
                <label for="crop">Crop</label>

                <select id="crop" required>
                    <option value="">Select Crop</option>
                    <option value="Wheat">Wheat</option>
                    <option value="Rice">Rice</option>
                    <option value="Maize">Maize</option>
                    <option value="Cotton">Cotton</option>
                    <option value="Barley">Barley</option>
                </select>
            </div>


            <div class="form-group">
                <label for="area">Area (hectares)</label>

                <input
                    type="number"
                    id="area"
                    placeholder="Enter area"
                    step="0.1"
                    required
                >
            </div>


            <div class="form-group">
                <label for="rainfall">Rainfall (mm)</label>

                <input
                    type="number"
                    id="rainfall"
                    placeholder="Enter rainfall"
                    step="0.1"
                    required
                >
            </div>


            <div class="form-group">
                <label for="temperature">Temperature (°C)</label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter temperature"
                    step="0.1"
                    required
                >
            </div>


            <div class="form-group">
                <label for="fertilizer">Fertilizer (kg)</label>

                <input
                    type="number"
                    id="fertilizer"
                    placeholder="Enter fertilizer quantity"
                    step="0.1"
                    required
                >
            </div>


            <div class="form-group">
                <label for="irrigation">Irrigation (times)</label>

                <input
                    type="number"
                    id="irrigation"
                    placeholder="Enter irrigation count"
                    required
                >
            </div>


            <div class="form-group">
                <label for="soil_ph">Soil pH</label>

                <input
                    type="number"
                    id="soil_ph"
                    placeholder="Enter soil pH"
                    step="0.1"
                    min="0"
                    max="14"
                    required
                >
            </div>


            <button type="submit">
                Predict Yield
            </button>

        </form>


        <div id="result" class="result">

            <h2>Predicted Yield</h2>

            <p id="predictionValue">-</p>

            <span>quintals/hectare</span>

        </div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
